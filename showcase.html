<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>HARLEY · Raymarching</title>
<style>
  html, body { margin: 0; height: 100%; background: #020205; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .ui { position: fixed; pointer-events: none; color: rgba(255,255,255,.85);
        font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  #brand { top: 28px; left: 32px; }
  #brand h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .6em; }
  #brand p { margin: 6px 0 0; font-size: 11px; letter-spacing: .25em; opacity: .5; }
  #fps { top: 28px; right: 32px; font: 11px/1 ui-monospace, Menlo, monospace; opacity: .45; letter-spacing: .1em; }
  #form { left: 0; right: 0; bottom: 64px; text-align: center; font-size: 13px; letter-spacing: .5em;
          transition: opacity .8s, transform .8s; }
  #form.hide { opacity: 0; transform: translateY(8px); }
  #hint { left: 0; right: 0; bottom: 32px; text-align: center; font-size: 11px; letter-spacing: .3em; opacity: .35; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
         color: #fff; font-family: sans-serif; }
  #home, #theme { pointer-events: auto; padding: 7px 16px; border-radius: 999px;
          border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.06);
          -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
          color: rgba(255,255,255,.85); text-decoration: none; font-size: 11px; letter-spacing: .3em;
          transition: background .3s, border-color .3s; }
  #home { top: 76px; left: 32px; }
  #theme { top: 52px; right: 32px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #home:hover, #home:active, #theme:hover, #theme:active { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.7); }
  /* 声控按钮：和 particles.html 同款，放在形态名上方 */
  #mic { pointer-events: auto; left: 50%; bottom: 96px; transform: translateX(-50%); padding: 13px 26px;
         border: 1px solid transparent; border-radius: 999px; cursor: pointer; white-space: nowrap;
         color: #05050a; font-size: 14px; font-weight: 600; letter-spacing: .2em;
         background: linear-gradient(90deg, #7cf7ff, #b18cff, #ff8ad8, #7cf7ff); background-size: 300% 100%;
         box-shadow: 0 0 24px rgba(160,140,255,.55); animation: flow 4s linear infinite;
         -webkit-tap-highlight-color: transparent; transition: color .3s, opacity .3s; }
  #mic:active { transform: translateX(-50%) scale(.96); }
  /* 开启后：按钮本身就是音量条，--v 是 0~1 的当前音量 */
  #mic.on { min-width: 220px; color: #fff; animation: none; border-color: rgba(124,247,255,.8);
            text-shadow: 0 1px 4px rgba(0,0,0,.6); background-size: 100% 100%;
            background: linear-gradient(90deg, rgba(124,247,255,.55) calc(var(--v, 0) * 100%), rgba(124,247,255,.1) 0);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); transition: border-color .15s; }
  #mic.on.loud { border-color: #ff8ad8; }
  #mic.busy { opacity: .7; }
  #micTip { left: 50%; bottom: 152px; transform: translateX(-50%); display: none; width: max-content; max-width: 86vw;
            padding: 7px 12px; border-radius: 10px; font-size: 11px; line-height: 1.6; text-align: center;
            background: rgba(255,170,60,.14); border: 1px solid rgba(255,170,60,.5); color: #ffd9a8; }
  @keyframes flow { to { background-position: 300% 0; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="brand"><h1>HARLEY</h1><p>REAL-TIME RAYMARCHING</p></div>
<a class="ui" id="home" href="index.html">← 返回首页</a>
<div class="ui" id="fps">-- FPS</div>
<button class="ui" id="theme" type="button">配色 · 幻彩</button>
<div class="ui" id="form">液态金属 · METABALLS</div>
<button class="ui" id="mic" type="button">🎤 开启声控</button>
<div class="ui" id="micTip"></div>
<div class="ui" id="hint">拖动旋转 · 轻点切换形态 · 双指缩放 · 拍手切换</div>
<div id="err">你的浏览器不支持 WebGL</div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 a;
void main() { gl_Position = vec4(a, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform vec2 uRot;
uniform float uMorph;
uniform float uDist;            // 相机距离（双指 / 滚轮缩放）
uniform float uLoud;            // 声控：音量力度 0~1（安静时 = 0）
uniform mat3 uHue;              // 声控：色相旋转矩阵（安静时 = 单位矩阵）
uniform vec3 uPalA, uPalB, uPalD;
#define PI 3.14159265

mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}
vec3 pal(float t) { return uHue * (uPalA + uPalB * cos(2.0 * PI * (t + uPalD))); }

// 形态一：液态金属融球
float fBlobs(vec3 p) {
  float d = length(p) - 0.9;
  for (int i = 0; i < 6; i++) {
    float f = float(i);
    vec3 o = vec3(sin(uTime * 0.7 + f * 1.7), cos(uTime * 0.5 + f * 2.3), sin(uTime * 0.6 + f * 0.9)) * 1.25;
    d = smin(d, length(p - o) - 0.32 - 0.08 * sin(f * 2.0 + uTime), 0.55);
  }
  return d;
}

// 形态二：陀螺极小曲面镂空球壳
float fGyroid(vec3 p) {
  vec3 q = p * 3.5;
  q.xy *= rot(uTime * 0.2);
  float g = abs(dot(sin(q), cos(q.yzx + uTime * 0.4))) / 3.5 - 0.04;
  float s = abs(length(p) - 1.35) - 0.12;
  return max(s, g * 0.8);
}

// 形态三：双螺旋扭结环
float fKnot(vec3 p) {
  p.xz *= rot(uTime * 0.3);
  vec2 q = vec2(length(p.xz) - 1.3, p.y);
  float a = atan(p.z, p.x);
  q *= rot(a * 1.5 + uTime);
  q.x = abs(q.x) - 0.28;
  return (length(q) - 0.2) * 0.8;
}

// 形态四：分形曼德球
float fBulb(vec3 p) {
  p.xz *= rot(uTime * 0.2);
  const float S = 1.2;
  p /= S;
  vec3 z = p;
  float dr = 1.0, r = 0.0;
  float pw = 8.0;
  for (int i = 0; i < 5; i++) {
    r = length(z);
    if (r > 2.0) break;
    float th = acos(clamp(z.z / r, -1.0, 1.0)) * pw;
    float ph = atan(z.y, z.x) * pw + uTime * 0.3;
    dr = pow(r, pw - 1.0) * pw * dr + 1.0;
    z = pow(r, pw) * vec3(sin(th) * cos(ph), sin(th) * sin(ph), cos(th)) + p;
  }
  return 0.5 * log(r) * r / dr * S;
}

float map(vec3 p) {
  p.yz *= rot(uRot.y);
  p.xz *= rot(uRot.x + uTime * 0.15);
  // 声控：整体膨胀（缩放坐标再把距离乘回来，SDF 仍然正确）；uLoud = 0 时 sc = 1，和原来完全一样
  float sc = 1.0 + uLoud * 0.12;
  p /= sc;
  float m = uMorph, d;
  if (m < 1.0)      d = mix(fBlobs(p), fGyroid(p), smoothstep(0.0, 1.0, m));
  else if (m < 2.0) d = mix(fGyroid(p), fKnot(p), smoothstep(0.0, 1.0, m - 1.0));
  else if (m < 3.0) d = mix(fKnot(p), fBulb(p), smoothstep(0.0, 1.0, m - 2.0));
  else              d = mix(fBulb(p), fBlobs(p), smoothstep(0.0, 1.0, m - 3.0));
  d *= sc;
  // 声控：表面起伏脉动，音量越大越强（uLoud = 0 时减去 0）
  d -= uLoud * 0.05 * sin(p.x * 6.0 + uTime * 5.0) * sin(p.y * 6.0 + uTime * 4.0) * sin(p.z * 6.0 + uTime * 6.0);
  return d * 0.75;
}

vec3 nor(vec3 p) {
  vec2 e = vec2(1.0, -1.0) * 0.0015;
  return normalize(e.xyy * map(p + e.xyy) + e.yyx * map(p + e.yyx) +
                   e.yxy * map(p + e.yxy) + e.xxx * map(p + e.xxx));
}

vec3 sky(vec3 rd) {
  vec3 c = vec3(0.01, 0.012, 0.03);
  c += pal(rd.y * 0.5 + uTime * 0.03) * pow(max(0.0, 1.0 - abs(rd.y)), 6.0) * 0.18;
  vec3 q = rd * 160.0;
  vec3 id = floor(q);
  float h = fract(sin(dot(id, vec3(127.1, 311.7, 74.7))) * 43758.5453);
  float tw = 0.6 + 0.4 * sin(uTime * 3.0 + h * 50.0);
  c += step(0.996, h) * smoothstep(0.45, 0.0, length(fract(q) - 0.5)) * tw;
  return c;
}

void main() {
  // 按短边适配：竖屏手机上物体不会超出左右边
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / min(uRes.x, uRes.y);
  vec3 ro = vec3(0.0, 0.0, uDist);
  vec3 rd = normalize(vec3(uv, -1.6));

  float t = 0.0, glow = 0.0;
  bool hit = false;
  for (int i = 0; i < 90; i++) {
    float d = map(ro + rd * t);
    glow += exp(-d * 10.0) * 0.015;
    if (d < 0.001) { hit = true; break; }
    t += d;
    if (t > uDist + 5.0) break;
  }

  vec3 col = sky(rd);
  if (hit) {
    vec3 p = ro + rd * t;
    vec3 n = nor(p);
    vec3 r = reflect(rd, n);
    vec3 l = normalize(vec3(0.6, 0.8, 0.5));
    float fre = pow(1.0 - max(dot(-rd, n), 0.0), 3.0);
    float dif = max(dot(n, l), 0.0);
    float spec = pow(max(dot(r, l), 0.0), 48.0);
    float ao = clamp(map(p + n * 0.15) / 0.11, 0.0, 1.0);
    vec3 base = pal(dot(n, vec3(0.3, 0.5, 0.2)) * 0.8 + length(p) * 0.3 + uTime * 0.05);
    col = base * (0.12 + 0.7 * dif) * ao
        + sky(r) * 0.6 * fre
        + base * fre * 0.9
        + vec3(spec) * 1.3;
  }
  col += pal(uTime * 0.05 + 0.6) * glow * 0.55;

  // ACES 色调映射 + Gamma + 暗角 + 胶片颗粒
  col = col * (2.51 * col + 0.03) / (col * (2.43 * col + 0.59) + 0.14);
  col = pow(clamp(col, 0.0, 1.0), vec3(0.4545));
  col *= 1.0 - 0.35 * dot(uv, uv);
  col += (fract(sin(dot(gl_FragCoord.xy + uTime, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * 0.03;
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
const cv = document.getElementById("c");
const gl = cv.getContext("webgl", { antialias: false, powerPreference: "high-performance" });
if (!gl) { document.getElementById("err").style.display = "flex"; throw new Error("no webgl"); }

function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, document.getElementById("vs").textContent));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, document.getElementById("fs").textContent));
gl.linkProgram(prog);
gl.useProgram(prog);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog, "a");
gl.enableVertexAttribArray(aLoc);
gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

const U = {
  res: gl.getUniformLocation(prog, "uRes"),
  time: gl.getUniformLocation(prog, "uTime"),
  rot: gl.getUniformLocation(prog, "uRot"),
  morph: gl.getUniformLocation(prog, "uMorph"),
  dist: gl.getUniformLocation(prog, "uDist"),
  loud: gl.getUniformLocation(prog, "uLoud"),
  hue: gl.getUniformLocation(prog, "uHue"),
  palA: gl.getUniformLocation(prog, "uPalA"),
  palB: gl.getUniformLocation(prog, "uPalB"),
  palD: gl.getUniformLocation(prog, "uPalD"),
};

// 配色主题（颜色 = a + b * cos(2π(t + d))）
const themes = [
  { name: "幻彩", a: [0.5, 0.5, 0.5],    b: [0.5, 0.5, 0.5],    d: [0.0, 0.33, 0.67] },
  { name: "霓虹", a: [0.55, 0.35, 0.65], b: [0.45, 0.45, 0.35], d: [0.75, 0.15, 0.45] },
  { name: "冰蓝", a: [0.4, 0.6, 0.8],    b: [0.25, 0.3, 0.2],   d: [0.0, 0.1, 0.2] },
  { name: "熔岩", a: [0.6, 0.28, 0.1],   b: [0.4, 0.28, 0.1],   d: [0.0, 0.08, 0.15] },
];
let themeIdx = 0;
const pal = { a: themes[0].a.slice(), b: themes[0].b.slice(), d: themes[0].d.slice() };
const themeEl = document.getElementById("theme");
themeEl.addEventListener("click", () => {
  themeIdx = (themeIdx + 1) % themes.length;
  themeEl.textContent = "配色 · " + themes[themeIdx].name;
});

// 自适应分辨率
const maxScale = Math.min(window.devicePixelRatio || 1, 1.5);
let scale = maxScale;
function resize() {
  cv.width = Math.floor(innerWidth * scale);
  cv.height = Math.floor(innerHeight * scale);
  gl.viewport(0, 0, cv.width, cv.height);
}
addEventListener("resize", resize);
resize();

// 形态切换
const forms = ["液态金属 · METABALLS", "极小曲面 · GYROID", "双螺旋环 · TWISTED TORUS", "分形曼德球 · MANDELBULB"];
const formEl = document.getElementById("form");
let target = 0, morph = 0, lastSwitch = performance.now();
function nextForm() {
  target++;
  lastSwitch = performance.now();
  if (!formEl) return;
  formEl.classList.add("hide");
  setTimeout(() => {
    formEl.textContent = forms[target % forms.length];
    formEl.classList.remove("hide");
  }, 500);
}

// 单指拖动旋转（带惯性）+ 轻点切换；双指 / 滚轮缩放
let rotX = 0, rotY = 0, velX = 0, velY = 0;
let dragging = false, lastX = 0, lastY = 0, moved = 0;
const dist0 = innerWidth < innerHeight ? 5.8 : 4.2;   // 竖屏默认拉远一些，横屏保持 4.2
let dist = dist0, distT = dist0, pinchD = 1, pinched = false;
const clampD = v => Math.max(2.6, Math.min(9.0, v));
const ptrs = new Map();                       // 活动指针：pointerId → 当前位置
function pinchLen() {
  const [a, b] = [...ptrs.values()];
  return Math.hypot(a.x - b.x, a.y - b.y) || 1;
}
cv.addEventListener("pointerdown", e => {
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  cv.setPointerCapture(e.pointerId);
  if (ptrs.size === 1) {
    dragging = true; pinched = false; moved = 0; lastX = e.clientX; lastY = e.clientY;
  } else {
    // 进入双指：停止旋转和惯性，这次操作结束前都不旋转、不切换
    dragging = false; pinched = true; velX = velY = 0;
    pinchD = pinchLen();
  }
});
cv.addEventListener("pointermove", e => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size >= 2) {
    const d = pinchLen();
    distT = clampD(distT * pinchD / d);       // 两指距离变大 = 拉近
    pinchD = d;
    return;
  }
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  velX = dx * 0.006; velY = dy * 0.006;
  lastX = e.clientX; lastY = e.clientY;
});
function release(e) {
  if (!ptrs.delete(e.pointerId)) return;
  if (ptrs.size >= 2) { pinchD = pinchLen(); return; }
  if (ptrs.size === 0) {
    if (dragging && !pinched && moved < 6 && e.type === "pointerup") nextForm();
    dragging = false; pinched = false;
  }
}
cv.addEventListener("pointerup", release);
cv.addEventListener("pointercancel", release);
// 电脑滚轮缩放
cv.addEventListener("wheel", e => {
  e.preventDefault();
  distT = clampD(distT * Math.exp(e.deltaY * 0.001));
}, { passive: false });

// 声控：和 particles.html 同款（只在本机分析，不录音不上传；需要 HTTPS 和用户授权）
const micEl = document.getElementById("mic");
const micTip = document.getElementById("micTip");
// env：力度包络 0~1；cent：频谱重心 0（低音）~1（高音）；gate：是否超过噪声底门限；lvl：音量条；hit：本帧是否重拍 / 音量突跳
const mic = { on: false, vol: 0, bass: 0, floor: 1, bassAvg: 0, volAvg: 0, env: 0, cent: 0.5, gate: false, lvl: 0, hit: false };
const inWeChat = /MicroMessenger/i.test(navigator.userAgent);
function showTip(msg) { micTip.textContent = msg; micTip.style.display = msg ? "block" : "none"; }
function closeCtx(c) { try { Promise.resolve(c.close()).catch(() => {}); } catch (_) {} }
// 出错只影响声控：按钮上方一行提示，手指操作照常
function micFail(e) {
  const name = e && e.name;
  let msg, btn = "🎤 点此重试";
  if (!e) {
    btn = "🎤 声控不可用";
    msg = !window.isSecureContext ? "声控需要 HTTPS 页面，请用 https:// 地址打开"
      : inWeChat ? "微信里不支持麦克风，请点右上角「…」用浏览器打开" : "当前浏览器不支持麦克风，请换 Safari / Chrome 打开";
  } else if (name === "NotAllowedError" || name === "SecurityError") {
    msg = "麦克风未授权，可在浏览器设置里打开；微信里请用浏览器打开";
  } else if (name === "NotFoundError" || name === "OverconstrainedError") {
    msg = "没有检测到麦克风";
  } else if (name === "NotReadableError" || name === "AbortError") {
    msg = "麦克风被其他应用占用，关掉后再试";
  } else {
    msg = "声控不可用（" + (name || "未知错误") + "），手指操作不受影响";
  }
  micEl.textContent = btn;
  showTip(msg);
}
function stopMic() {
  mic.stream.getTracks().forEach(t => t.stop());
  closeCtx(mic.ctx);
  Object.assign(mic, { on: false, vol: 0, bass: 0, env: 0, gate: false, lvl: 0, hit: false });
  micEl.classList.remove("on", "loud"); micEl.textContent = "🎤 开启声控";
  micEl.style.boxShadow = ""; micEl.style.removeProperty("--v");
}
async function toggleMic() {
  if (mic.busy) return;
  if (mic.on) { stopMic(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !AC) { micFail(null); return; }
  let ctx = null, stream = null;
  mic.busy = true;
  micEl.classList.add("busy"); micEl.textContent = "🎤 授权中…"; showTip("");
  try {
    // iPhone Safari：AudioContext 必须在点击的同步阶段新建并 resume，麦克风也在这里同步申请，任何 await 都放在后面
    ctx = new AC();
    const resumed = ctx.resume();
    // 三项处理全关：拿原始声音，鼓点 / 拍手的起伏不会被自动增益压平
    const asked = navigator.mediaDevices.getUserMedia(
      { audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    stream = await asked;
    await resumed;
    if (ctx.state !== "running") await ctx.resume();
    // 只接到 AnalyserNode 读频谱：不接扬声器（不会啸叫），不用 MediaRecorder，不发网络请求 → 不录音、不上传
    const an = ctx.createAnalyser();
    an.fftSize = 512; an.smoothingTimeConstant = 0.6;
    ctx.createMediaStreamSource(stream).connect(an);
    // 麦克风被系统断开（来电、权限被收回）时自动关掉
    stream.getTracks().forEach(t => { t.onended = () => { if (mic.on) { stopMic(); showTip("麦克风已断开，点按钮可重新开启"); } }; });
    Object.assign(mic, { on: true, stream, ctx, an, buf: new Uint8Array(an.frequencyBinCount),
      floor: 1, bassAvg: 0, volAvg: 0, env: 0, cent: 0.5, gate: false, lvl: 0, hit: false });
    micEl.classList.add("on"); micEl.textContent = "🎤 声控中 · 点击关闭";
  } catch (e) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (ctx) closeCtx(ctx);
    micFail(e);
  }
  mic.busy = false;
  micEl.classList.remove("busy");
}
micEl.addEventListener("click", toggleMic);
function readMic() {
  if (!mic.on) return false;
  mic.an.getByteFrequencyData(mic.buf);
  const b = mic.buf, n = b.length;            // 每格约 90Hz
  let lo = 0, all = 0, wsum = 0;
  for (let i = 1; i < n; i++) {
    const v = b[i] / 255;
    all += v; wsum += v * i;
    if (i < 6) lo += v;
  }
  mic.vol = all / (n - 1); mic.bass = lo / 5;
  // 自适应噪声底：更安静就立刻跟下去；没出声时约 5 秒跟上环境变吵；出声时几乎冻结
  if (mic.vol < mic.floor) mic.floor = mic.vol;
  else mic.floor += (mic.vol - mic.floor) * (mic.gate ? 0.0005 : 0.004);
  // 带回差的门限：超过 底噪×1.5+0.015 才算有声，降到 底噪×1.2+0.008 以下才算安静
  if (!mic.gate && mic.vol > mic.floor * 1.5 + 0.015) mic.gate = true;
  else if (mic.gate && mic.vol < mic.floor * 1.2 + 0.008) mic.gate = false;
  // 力度包络：涨得快、落得慢
  const target = mic.gate ? Math.min(1, (mic.vol - mic.floor) * 6) : 0;
  mic.env += (target - mic.env) * (target > mic.env ? 0.5 : 0.12);
  // 频谱重心：按对数映射到 0~1，约 280Hz → 0，约 3.7kHz → 1
  if (mic.gate && all > 0) {
    const t = Math.log(wsum / all / 3) / Math.log(40 / 3);
    mic.cent += (Math.min(1, Math.max(0, t)) - mic.cent) * 0.15;
  }
  // 重拍：低音突增，或整体音量突然跳高（拍手）；用更新前的平均值比较
  mic.hit = mic.gate && ((mic.bass > 0.35 && mic.bass > mic.bassAvg * 1.5) || mic.vol > mic.volAvg * 1.6 + 0.04);
  mic.bassAvg += (mic.bass - mic.bassAvg) * 0.05;
  mic.volAvg += (mic.vol - mic.volAvg) * 0.05;
  micEl.style.boxShadow = "0 0 " + Math.round(mic.env * 40) + "px rgba(124,247,255,.8)";
  // 音量条：开方让小音量也看得见，再平滑一下避免抖动；过门限时边框变粉
  mic.lvl += (Math.min(1, Math.sqrt(mic.vol * 2.5)) - mic.lvl) * 0.35;
  micEl.style.setProperty("--v", mic.lvl.toFixed(3));
  micEl.classList.toggle("loud", mic.gate);
  return true;
}
// 色相旋转矩阵：和 particles.html 的 hueRot 同一个公式（绕灰轴 (1,1,1) 转 a 弧度），写成列主序 mat3 给着色器
// 配色是逐通道的余弦公式，只能转输出颜色；a = 0 时正好是单位矩阵
function hueMat(a) {
  const cs = Math.cos(a), s = Math.sin(a) / Math.sqrt(3), t = (1 - cs) / 3;
  return [cs + t, s + t, t - s,   t - s, cs + t, s + t,   s + t, t - s, cs + t];
}
let hue = 0;

// 主循环
const fpsEl = document.getElementById("fps");
let prev = performance.now(), acc = 0, frames = 0;
function frame(now) {
  const dt = now - prev; prev = now;
  acc += dt; frames++;
  if (frames === 40) {
    const avg = acc / frames;
    fpsEl.textContent = Math.round(1000 / avg) + " FPS · " + Math.round(scale * 100) + "%";
    if (avg > 26 && scale > 0.45) { scale *= 0.85; resize(); }
    else if (avg < 15 && scale < maxScale) { scale = Math.min(maxScale, scale * 1.1); resize(); }
    acc = 0; frames = 0;
  }

  if (now - lastSwitch > 8000) nextForm();

  rotX += velX; rotY += velY;
  rotY = Math.max(-1.2, Math.min(1.2, rotY));
  velX *= 0.93; velY *= 0.93;
  morph += (target - morph) * 0.035;
  dist += (distT - dist) * 0.15;
  // 声控：音量 → 膨胀 + 脉动；拍手 / 重拍 → 下一个形态（距上次切换 ≥ 1.2 秒）；频谱重心 → 色相缓慢偏移
  const heard = readMic(), loud = heard ? mic.env : 0;
  if (heard && mic.hit && now - lastSwitch > 1200) nextForm();
  hue += ((heard && mic.gate ? (mic.cent - 0.5) * 2.2 : 0) - hue) * 0.02;
  if (Math.abs(hue) < 1e-4) hue = 0;

  gl.uniform2f(U.res, cv.width, cv.height);
  gl.uniform1f(U.time, now / 1000);
  gl.uniform2f(U.rot, rotX, rotY);
  gl.uniform1f(U.morph, ((morph % 4) + 4) % 4);
  gl.uniform1f(U.dist, dist);
  gl.uniform1f(U.loud, loud);
  gl.uniformMatrix3fv(U.hue, false, hueMat(hue));
  const th = themes[themeIdx];
  for (const k of ["a", "b", "d"]) for (let i = 0; i < 3; i++) pal[k][i] += (th[k][i] - pal[k][i]) * 0.05;
  gl.uniform3fv(U.palA, pal.a);
  gl.uniform3fv(U.palB, pal.b);
  gl.uniform3fv(U.palD, pal.d);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
