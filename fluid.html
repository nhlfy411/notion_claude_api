<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>HARLEY · 实时流体</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  .ui { position: fixed; pointer-events: none; color: rgba(255,255,255,.85);
        font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  #brand { top: 28px; left: 32px; }
  #brand h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .6em; }
  #brand p { margin: 6px 0 0; font-size: 11px; letter-spacing: .25em; opacity: .5; }
  #fps { top: 28px; right: 32px; font: 11px/1 ui-monospace, Menlo, monospace; opacity: .45; letter-spacing: .1em; }
  #hint { left: 0; right: 0; bottom: 36px; text-align: center; font-size: 11px; letter-spacing: .3em; opacity: .4; }
  #sign { right: 18px; bottom: 12px; font-size: 10px; letter-spacing: .2em; font-style: italic; opacity: .55; }
  #note { top: 124px; left: 50%; transform: translateX(-50%); display: none; width: max-content; max-width: 82vw;
          padding: 9px 14px; border-radius: 12px; font-size: 11px; line-height: 1.7; text-align: center;
          background: rgba(255,170,60,.14); border: 1px solid rgba(255,170,60,.5); color: #ffd9a8; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px;
         color: #fff; font-family: sans-serif; text-align: center; }
  #home { pointer-events: auto; top: 76px; left: 32px; padding: 7px 16px; border-radius: 999px;
          border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.06);
          -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
          color: rgba(255,255,255,.85); text-decoration: none; font-size: 11px; letter-spacing: .3em;
          transition: background .3s, border-color .3s; }
  #home:hover, #home:active { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.7); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="brand"><h1>HARLEY</h1><p>REAL-TIME FLUID</p></div>
<a class="ui" id="home" href="index.html">← 返回首页</a>
<div class="ui" id="fps">-- FPS</div>
<div class="ui" id="note">当前设备不支持浮点纹理，无法运行实时流体模拟<br>已降级为简化墨水动画（只跟随手指，不会被搅动）</div>
<div class="ui" id="hint">手指划过搅动流体 · 轻点喷出颜色</div>
<div class="ui" id="sign">Written by Claude</div>
<div id="err">你的浏览器不支持 WebGL</div>

<script>
const cv = document.getElementById("c");
const errEl = document.getElementById("err");
const opts = { alpha: false, depth: false, stencil: false, antialias: false, powerPreference: "high-performance" };
let gl = cv.getContext("webgl2", opts);
const isGL2 = !!gl;
if (!gl) gl = cv.getContext("webgl", opts) || cv.getContext("experimental-webgl", opts);
if (!gl) { errEl.style.display = "flex"; throw new Error("no webgl"); }

const scale = Math.min(window.devicePixelRatio || 1, 1.5);
function resize() { cv.width = Math.floor(innerWidth * scale); cv.height = Math.floor(innerHeight * scale); }
addEventListener("resize", resize);
resize();

// 检测能否渲染到浮点纹理：WebGL2 半精度 → WebGL1 半精度 → WebGL1 全精度
function testFormat(internal, type, linear) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, 4, 4, 0, gl.RGBA, type, null);
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.deleteFramebuffer(f); gl.deleteTexture(t);
  return ok ? { internal, type, linear } : null;
}
function pickFormat() {
  if (isGL2) {
    gl.getExtension("EXT_color_buffer_float");
    gl.getExtension("EXT_color_buffer_half_float");
    return testFormat(gl.RGBA16F, gl.HALF_FLOAT, true);
  }
  const hf = gl.getExtension("OES_texture_half_float");
  const r = hf && testFormat(gl.RGBA, hf.HALF_FLOAT_OES, !!gl.getExtension("OES_texture_half_float_linear"));
  if (r) return r;
  return gl.getExtension("OES_texture_float")
    ? testFormat(gl.RGBA, gl.FLOAT, !!gl.getExtension("OES_texture_float_linear")) : null;
}

const VS = `attribute vec2 aPos; uniform vec2 texel; varying vec2 vUv, vL, vR, vT, vB;
void main() {
  vUv = aPos * 0.5 + 0.5;
  vL = vUv - vec2(texel.x, 0.0); vR = vUv + vec2(texel.x, 0.0);
  vT = vUv + vec2(0.0, texel.y); vB = vUv - vec2(0.0, texel.y);
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;
const H = "precision highp float;\nprecision mediump sampler2D;\nvarying vec2 vUv, vL, vR, vT, vB;\nuniform vec2 texel;\n";
const FS = {
  splat: `uniform sampler2D uTarget; uniform float aspect, radius; uniform vec3 color; uniform vec2 point;
void main() {
  vec2 p = vUv - point; p.x *= aspect;
  gl_FragColor = vec4(texture2D(uTarget, vUv).xyz + exp(-dot(p, p) / radius) * color, 1.0);
}`,
  advect: `uniform sampler2D uVelocity, uSource; uniform vec2 srcTexel; uniform float dt, dissipation;
vec4 bilerp(sampler2D s, vec2 uv, vec2 ts) {
  vec2 st = uv / ts - 0.5; vec2 i = floor(st), f = fract(st);
  vec4 a = texture2D(s, (i + vec2(0.5, 0.5)) * ts), b = texture2D(s, (i + vec2(1.5, 0.5)) * ts);
  vec4 c = texture2D(s, (i + vec2(0.5, 1.5)) * ts), d = texture2D(s, (i + vec2(1.5, 1.5)) * ts);
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
void main() {
#ifdef MANUAL
  vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texel).xy * texel;
  vec4 r = bilerp(uSource, coord, srcTexel);
#else
  vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texel;
  vec4 r = texture2D(uSource, coord);
#endif
  gl_FragColor = r / (1.0 + dissipation * dt);
}`,
  divergence: `uniform sampler2D uVelocity;
void main() {
  float L = texture2D(uVelocity, vL).x, R = texture2D(uVelocity, vR).x;
  float T = texture2D(uVelocity, vT).y, B = texture2D(uVelocity, vB).y;
  vec2 C = texture2D(uVelocity, vUv).xy;
  if (vL.x < 0.0) L = -C.x; if (vR.x > 1.0) R = -C.x;
  if (vT.y > 1.0) T = -C.y; if (vB.y < 0.0) B = -C.y;
  gl_FragColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
}`,
  curl: `uniform sampler2D uVelocity;
void main() {
  float L = texture2D(uVelocity, vL).y, R = texture2D(uVelocity, vR).y;
  float T = texture2D(uVelocity, vT).x, B = texture2D(uVelocity, vB).x;
  gl_FragColor = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);
}`,
  vorticity: `uniform sampler2D uVelocity, uCurl; uniform float curl, dt;
void main() {
  float L = texture2D(uCurl, vL).x, R = texture2D(uCurl, vR).x;
  float T = texture2D(uCurl, vT).x, B = texture2D(uCurl, vB).x, C = texture2D(uCurl, vUv).x;
  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
  force /= length(force) + 1e-4; force *= curl * C; force.y *= -1.0;
  vec2 v = texture2D(uVelocity, vUv).xy + force * dt;
  gl_FragColor = vec4(clamp(v, -1000.0, 1000.0), 0.0, 1.0);
}`,
  pressure: `uniform sampler2D uPressure, uDivergence;
void main() {
  float L = texture2D(uPressure, vL).x, R = texture2D(uPressure, vR).x;
  float T = texture2D(uPressure, vT).x, B = texture2D(uPressure, vB).x;
  gl_FragColor = vec4((L + R + B + T - texture2D(uDivergence, vUv).x) * 0.25, 0.0, 0.0, 1.0);
}`,
  gradient: `uniform sampler2D uPressure, uVelocity;
void main() {
  float L = texture2D(uPressure, vL).x, R = texture2D(uPressure, vR).x;
  float T = texture2D(uPressure, vT).x, B = texture2D(uPressure, vB).x;
  gl_FragColor = vec4(texture2D(uVelocity, vUv).xy - vec2(R - L, T - B), 0.0, 1.0);
}`,
  clear: `uniform sampler2D uTexture; uniform float value;
void main() { gl_FragColor = value * texture2D(uTexture, vUv); }`,
  display: `uniform sampler2D uTexture;
void main() {
  vec3 c = texture2D(uTexture, vUv).rgb;
  float dx = length(texture2D(uTexture, vR).rgb) - length(texture2D(uTexture, vL).rgb);
  float dy = length(texture2D(uTexture, vT).rgb) - length(texture2D(uTexture, vB).rgb);
  vec3 n = normalize(vec3(dx, dy, length(texel)));
  c *= clamp(n.z + 0.7, 0.7, 1.0);
  c = pow(1.0 - exp(-c * 1.6), vec3(0.85));
  gl_FragColor = vec4(c, 1.0);
}`,
};
// 降级动画：程序化墨水，只跟随手指
const FALLBACK = `#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uRes, uPt; uniform float uTime;
float h(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h(i), h(i + vec2(1.0, 0.0)), f.x), mix(h(i + vec2(0.0, 1.0)), h(i + 1.0), f.x), f.y); }
float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { s += a * n(p); p *= 2.03; a *= 0.5; } return s; }
void main() {
  vec2 uv = gl_FragCoord.xy / uRes.y, m = uPt * vec2(uRes.x / uRes.y, 1.0);
  float d = exp(-length(uv - m) * 4.0), t = mod(uTime, 1000.0);
  vec2 q = vec2(fbm(uv * 2.0 + t * 0.1), fbm(uv * 2.0 + 5.2 - t * 0.08));
  float f = fbm(uv * 2.0 + q * 3.0 + d * 2.0);
  vec3 c = 0.5 + 0.5 * cos(6.28318 * (f + q.x + vec3(0.0, 0.33, 0.67) + t * 0.05));
  gl_FragColor = vec4(c * f * f * 1.6 + d * 0.2, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
let vsObj;
function program(fs) {
  vsObj = vsObj || compile(gl.VERTEX_SHADER, VS);
  const p = gl.createProgram();
  gl.attachShader(p, vsObj);
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, "aPos");
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  for (let i = 0, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i < n; i++) {
    const name = gl.getActiveUniform(p, i).name;
    u[name] = gl.getUniformLocation(p, name);
  }
  return { use() { gl.useProgram(p); return u; } };
}

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.enableVertexAttribArray(0);
function blit(t) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, t ? t.f : null);
  gl.viewport(0, 0, t ? t.w : cv.width, t ? t.h : cv.height);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

const fpsEl = document.getElementById("fps");
let prev = performance.now(), acc = 0, frames = 0;
function meter(now, label) {
  acc += now - prev; prev = now;
  if (++frames < 40) return 0;
  const avg = acc / frames;
  acc = 0; frames = 0;
  fpsEl.textContent = Math.round(1000 / avg) + " FPS · " + label;
  return avg;
}
const toUv = e => [e.clientX / innerWidth, 1 - e.clientY / innerHeight];

function runFallback() {
  document.getElementById("note").style.display = "block";
  document.getElementById("hint").textContent = "简化模式 · 移动手指引导墨水";
  const prog = program(FALLBACK), pt = [0.5, 0.5];
  const follow = e => { [pt[0], pt[1]] = toUv(e); };
  cv.addEventListener("pointerdown", follow);
  cv.addEventListener("pointermove", follow);
  (function frame(now) {
    meter(now, "简化模式");
    const u = prog.use();
    gl.uniform2f(u.uRes, cv.width, cv.height);
    gl.uniform1f(u.uTime, now / 1000);
    gl.uniform2f(u.uPt, pt[0], pt[1]);
    blit(null);
    requestAnimationFrame(frame);
  })(prev);
}

function runFluid(FMT) {
  const P = {};
  for (const k in FS) P[k] = program((FMT.linear ? "" : "#define MANUAL\n") + H + FS[k]);
  function fbo(w, h) {
    gl.activeTexture(gl.TEXTURE0);
    const t = gl.createTexture(), filter = FMT.linear ? gl.LINEAR : gl.NEAREST;
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, FMT.internal, w, h, 0, gl.RGBA, FMT.type, null);
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    return { f, w, h, tx: 1 / w, ty: 1 / h,
      attach(i) { gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, t); return i; } };
  }
  function pingpong(w, h) {
    let a = fbo(w, h), b = fbo(w, h);
    return { tx: 1 / w, ty: 1 / h, get read() { return a; }, get write() { return b; },
      swap() { const t = a; a = b; b = t; } };
  }
  function res(r) {
    let a = cv.width / cv.height;
    if (a < 1) a = 1 / a;
    const big = Math.round(r * a);
    return cv.width > cv.height ? [big, r] : [r, big];
  }
  const mobile = innerWidth < 820;
  const [sw, sh] = res(128), [dw, dh] = res(mobile ? 512 : 1024);
  const vel = pingpong(sw, sh), pres = pingpong(sw, sh), dye = pingpong(dw, dh);
  const div = fbo(sw, sh), curl = fbo(sw, sh);
  let iters = 20;

  function hsv(h) {
    const i = Math.floor(h * 6), f = h * 6 - i;
    return [[1, f, 0], [1 - f, 1, 0], [0, 1, f], [0, 1 - f, 1], [f, 0, 1], [1, 0, 1 - f]][i % 6];
  }
  function splat(x, y, dx, dy, color, rMul) {
    const aspect = cv.width / cv.height, u = P.splat.use();
    gl.uniform1f(u.aspect, aspect);
    gl.uniform2f(u.point, x, y);
    gl.uniform1f(u.radius, 0.0025 * rMul * (aspect > 1 ? aspect : 1));
    gl.uniform1i(u.uTarget, vel.read.attach(0));
    gl.uniform3f(u.color, dx, dy, 0);
    blit(vel.write); vel.swap();
    gl.uniform1i(u.uTarget, dye.read.attach(0));
    gl.uniform3f(u.color, color[0], color[1], color[2]);
    blit(dye.write); dye.swap();
  }
  // 轻点：中心一团 + 向四周喷射
  function burst(x, y) {
    const c = hsv(Math.random());
    splat(x, y, 0, 0, c.map(v => v * 0.8), 2.5);
    for (let k = 0; k < 6; k++) {
      const a = k / 6 * Math.PI * 2 + Math.random() * 0.5;
      splat(x + Math.cos(a) * 0.01, y + Math.sin(a) * 0.01, Math.cos(a) * 700, Math.sin(a) * 700, c.map(v => v * 0.25), 1.5);
    }
  }
  function randomSplat() {
    splat(Math.random(), Math.random(), (Math.random() - 0.5) * 1000, (Math.random() - 0.5) * 1000,
      hsv(Math.random()).map(v => v * 0.8), 1.5);
  }

  const ptr = { down: false, x: 0, y: 0, dx: 0, dy: 0, px: 0, py: 0, moved: 0 };
  let lastInput = -1e9, lastAuto = 0;
  cv.addEventListener("pointerdown", e => {
    Object.assign(ptr, { down: true, moved: 0, dx: 0, dy: 0, px: e.clientX, py: e.clientY });
    [ptr.x, ptr.y] = toUv(e);
    lastInput = performance.now();
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener("pointermove", e => {
    if (!ptr.down) return;
    const [x, y] = toUv(e);
    ptr.moved += Math.hypot(e.clientX - ptr.px, e.clientY - ptr.py);
    ptr.px = e.clientX; ptr.py = e.clientY;
    ptr.dx += x - ptr.x; ptr.dy += y - ptr.y;
    ptr.x = x; ptr.y = y;
    lastInput = performance.now();
  });
  function release() {
    if (!ptr.down) return;
    ptr.down = false;
    if (ptr.moved < 6) burst(ptr.x, ptr.y);
  }
  cv.addEventListener("pointerup", release);
  cv.addEventListener("pointercancel", release);

  function step(dt) {
    let u = P.curl.use();
    gl.uniform2f(u.texel, vel.tx, vel.ty);
    gl.uniform1i(u.uVelocity, vel.read.attach(0));
    blit(curl);
    u = P.vorticity.use();
    gl.uniform2f(u.texel, vel.tx, vel.ty);
    gl.uniform1i(u.uVelocity, vel.read.attach(0));
    gl.uniform1i(u.uCurl, curl.attach(1));
    gl.uniform1f(u.curl, 30);
    gl.uniform1f(u.dt, dt);
    blit(vel.write); vel.swap();
    u = P.divergence.use();
    gl.uniform2f(u.texel, vel.tx, vel.ty);
    gl.uniform1i(u.uVelocity, vel.read.attach(0));
    blit(div);
    u = P.clear.use();
    gl.uniform1i(u.uTexture, pres.read.attach(0));
    gl.uniform1f(u.value, 0.8);
    blit(pres.write); pres.swap();
    u = P.pressure.use();
    gl.uniform2f(u.texel, vel.tx, vel.ty);
    gl.uniform1i(u.uDivergence, div.attach(0));
    for (let i = 0; i < iters; i++) {
      gl.uniform1i(u.uPressure, pres.read.attach(1));
      blit(pres.write); pres.swap();
    }
    u = P.gradient.use();
    gl.uniform2f(u.texel, vel.tx, vel.ty);
    gl.uniform1i(u.uPressure, pres.read.attach(0));
    gl.uniform1i(u.uVelocity, vel.read.attach(1));
    blit(vel.write); vel.swap();
    u = P.advect.use();
    gl.uniform2f(u.texel, vel.tx, vel.ty);
    gl.uniform2f(u.srcTexel, vel.tx, vel.ty);
    gl.uniform1f(u.dt, dt);
    gl.uniform1i(u.uVelocity, vel.read.attach(0));
    gl.uniform1i(u.uSource, vel.read.attach(0));
    gl.uniform1f(u.dissipation, 0.2);
    blit(vel.write); vel.swap();
    gl.uniform2f(u.srcTexel, dye.tx, dye.ty);
    gl.uniform1i(u.uVelocity, vel.read.attach(0));
    gl.uniform1i(u.uSource, dye.read.attach(1));
    gl.uniform1f(u.dissipation, 1.0);
    blit(dye.write); dye.swap();
  }

  for (let i = 0; i < 5; i++) randomSplat();
  (function frame(now) {
    const dt = Math.min((now - prev) / 1000, 1 / 60);
    const avg = meter(now, sw + "×" + sh + " · " + iters + " 迭代");
    if (avg > 22 && iters > 8) iters -= 4;
    else if (avg && avg < 16 && iters < 20) iters += 2;

    if (ptr.down && ptr.moved > 6 && (ptr.dx || ptr.dy)) {
      const aspect = cv.width / cv.height;
      let dx = ptr.dx, dy = ptr.dy;
      if (aspect < 1) dx *= aspect; else dy /= aspect;
      splat(ptr.x, ptr.y, dx * 6000, dy * 6000, hsv((now / 4000) % 1).map(v => v * 0.18), 1);
      ptr.dx = ptr.dy = 0;
    }
    if (now - lastInput > 4000 && now - lastAuto > 2500) { randomSplat(); lastAuto = now; }

    step(dt);
    const u = P.display.use();
    gl.uniform2f(u.texel, dye.tx, dye.ty);
    gl.uniform1i(u.uTexture, dye.read.attach(0));
    blit(null);
    requestAnimationFrame(frame);
  })(prev);
}

try {
  const FMT = pickFormat();
  if (FMT) runFluid(FMT); else runFallback();
} catch (e) {
  errEl.textContent = "初始化失败：" + e.message;
  errEl.style.display = "flex";
}
</script>
</body>
</html>
