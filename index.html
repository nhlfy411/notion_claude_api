<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>HARLEY · 首页</title>
<style>
  html, body { margin: 0; height: 100%; background: #020205; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .ui { position: fixed; pointer-events: none; color: rgba(255,255,255,.85);
        font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  #brand { top: 28px; left: 32px; }
  #brand h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .6em; }
  #brand p { margin: 6px 0 0; font-size: 11px; letter-spacing: .25em; opacity: .5; }
  #fps { top: 28px; right: 32px; font: 11px/1 ui-monospace, Menlo, monospace; opacity: .45; letter-spacing: .1em; }
  #form { left: 0; right: 0; bottom: 64px; text-align: center; font-size: 13px; letter-spacing: .5em;
          transition: opacity .8s, transform .8s; }
  #form.hide { opacity: 0; transform: translateY(8px); }
  #hint { left: 0; right: 0; bottom: 32px; text-align: center; font-size: 11px; letter-spacing: .3em; opacity: .35; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
         color: #fff; font-family: sans-serif; }
  #hero { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: 16px; text-align: center; pointer-events: none; color: #fff;
          font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
          background: radial-gradient(ellipse at center, rgba(2,2,5,.1) 0%, rgba(2,2,5,.6) 75%); }
  #hero h1 { margin: 0; font-size: clamp(34px, 10vw, 68px); font-weight: 600; letter-spacing: .4em;
             padding-left: .4em; text-shadow: 0 0 32px rgba(255,255,255,.35); }
  #hero p { margin: 0; font-size: 12px; letter-spacing: .35em; padding-left: .35em; opacity: .6; }
  #deck { pointer-events: auto; position: relative; width: 100vw; margin-top: 20px; display: flex; gap: 16px;
          overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; touch-action: pan-x;
          padding: 12px calc(50vw - min(39vw, 160px)); box-sizing: border-box; scrollbar-width: none; }
  #deck::-webkit-scrollbar { display: none; }
  .card { flex: 0 0 min(78vw, 320px); scroll-snap-align: center; box-sizing: border-box; padding: 22px 20px 20px;
          border-radius: 22px; text-align: left; position: relative; overflow: hidden;
          border: 1px solid rgba(255,255,255,.14); background: rgba(12,12,24,.45);
          -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
          transform: scale(.9); opacity: .55; transition: transform .45s, opacity .45s, border-color .45s; }
  .card.on { transform: scale(1); opacity: 1; border-color: rgba(255,255,255,.32); }
  .card::before { content: ""; position: absolute; top: -40%; right: -20%; width: 70%; aspect-ratio: 1;
          border-radius: 50%; background: var(--c); filter: blur(40px); opacity: .55; }
  .card .tag { position: relative; font-size: 10px; letter-spacing: .3em; opacity: .6; }
  .card h2 { position: relative; margin: 10px 0 6px; font-size: 20px; font-weight: 600; letter-spacing: .12em; }
  .card .desc { position: relative; margin: 0 0 20px; font-size: 12px; line-height: 1.7; opacity: .7; letter-spacing: .05em; }
  .card .go { position: relative; display: block; text-align: center; padding: 14px 0; border-radius: 999px;
          color: #05050a; background: linear-gradient(90deg, #7cf7ff, #b18cff, #ff8ad8, #7cf7ff); background-size: 300% 100%;
          text-decoration: none; font-size: 14px; font-weight: 600; letter-spacing: .3em;
          box-shadow: 0 0 24px rgba(160,140,255,.55); animation: flow 4s linear infinite; }
  .card .go:active { transform: scale(.97); }
  .card .go.soon { background: rgba(255,255,255,.08); color: rgba(255,255,255,.6); box-shadow: none; animation: none;
          border: 1px dashed rgba(255,255,255,.3); pointer-events: none; }
  @keyframes flow { to { background-position: 300% 0; } }
  #dots { display: flex; gap: 8px; pointer-events: auto; }
  #dots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.3); cursor: pointer;
            transition: width .3s, background .3s; }
  #dots i.on { width: 20px; background: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="fps">-- FPS</div>
<div id="hero">
  <h1>HARLEY</h1>
  <p>REAL-TIME RAYMARCHING</p>
  <div id="deck">
    <div class="card" style="--c:#7cf7ff">
      <div class="tag">01 · RAYMARCHING</div>
      <h2>光线步进形态馆</h2>
      <div class="desc">4 种实时 3D 形态，含曼德球分形，一键切换配色。纯 GPU 着色器，零模型文件。</div>
      <a class="go" href="showcase.html">立即体验 →</a>
    </div>
    <div class="card" style="--c:#ff8ad8">
      <div class="tag">02 · GPU PARTICLES</div>
      <h2>粒子星系</h2>
      <div class="desc">数十万粒子在 GPU 上实时演算，用手指拨动整条星河。</div>
      <a class="go soon">即将上线</a>
    </div>
    <div class="card" style="--c:#ffd36e">
      <div class="tag">03 · LAB</div>
      <h2>更多实验</h2>
      <div class="desc">流体、分形、音频可视化……持续更新中。</div>
      <a class="go soon">敬请期待</a>
    </div>
  </div>
  <div id="dots"></div>
</div>
<div class="ui" id="hint">左右滑动选择演示 · 拖动背景旋转</div>
<div id="err">你的浏览器不支持 WebGL</div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 a;
void main() { gl_Position = vec4(a, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform vec2 uRot;
uniform float uMorph;
#define PI 3.14159265

mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}
vec3 pal(float t) { return 0.5 + 0.5 * cos(2.0 * PI * (t + vec3(0.0, 0.33, 0.67))); }

// 形态一：液态金属融球
float fBlobs(vec3 p) {
  float d = length(p) - 0.9;
  for (int i = 0; i < 6; i++) {
    float f = float(i);
    vec3 o = vec3(sin(uTime * 0.7 + f * 1.7), cos(uTime * 0.5 + f * 2.3), sin(uTime * 0.6 + f * 0.9)) * 1.25;
    d = smin(d, length(p - o) - 0.32 - 0.08 * sin(f * 2.0 + uTime), 0.55);
  }
  return d;
}

// 形态二：陀螺极小曲面镂空球壳
float fGyroid(vec3 p) {
  vec3 q = p * 3.5;
  q.xy *= rot(uTime * 0.2);
  float g = abs(dot(sin(q), cos(q.yzx + uTime * 0.4))) / 3.5 - 0.04;
  float s = abs(length(p) - 1.35) - 0.12;
  return max(s, g * 0.8);
}

// 形态三：双螺旋扭结环
float fKnot(vec3 p) {
  p.xz *= rot(uTime * 0.3);
  vec2 q = vec2(length(p.xz) - 1.3, p.y);
  float a = atan(p.z, p.x);
  q *= rot(a * 1.5 + uTime);
  q.x = abs(q.x) - 0.28;
  return (length(q) - 0.2) * 0.8;
}

float map(vec3 p) {
  p.yz *= rot(uRot.y);
  p.xz *= rot(uRot.x + uTime * 0.15);
  float m = uMorph, d;
  if (m < 1.0)      d = mix(fBlobs(p), fGyroid(p), smoothstep(0.0, 1.0, m));
  else if (m < 2.0) d = mix(fGyroid(p), fKnot(p), smoothstep(0.0, 1.0, m - 1.0));
  else              d = mix(fKnot(p), fBlobs(p), smoothstep(0.0, 1.0, m - 2.0));
  return d * 0.75;
}

vec3 nor(vec3 p) {
  vec2 e = vec2(1.0, -1.0) * 0.0015;
  return normalize(e.xyy * map(p + e.xyy) + e.yyx * map(p + e.yyx) +
                   e.yxy * map(p + e.yxy) + e.xxx * map(p + e.xxx));
}

vec3 sky(vec3 rd) {
  vec3 c = vec3(0.01, 0.012, 0.03);
  c += pal(rd.y * 0.5 + uTime * 0.03) * pow(max(0.0, 1.0 - abs(rd.y)), 6.0) * 0.18;
  vec3 q = rd * 160.0;
  vec3 id = floor(q);
  float h = fract(sin(dot(id, vec3(127.1, 311.7, 74.7))) * 43758.5453);
  float tw = 0.6 + 0.4 * sin(uTime * 3.0 + h * 50.0);
  c += step(0.996, h) * smoothstep(0.45, 0.0, length(fract(q) - 0.5)) * tw;
  return c;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  vec3 ro = vec3(0.0, 0.0, 4.2);
  vec3 rd = normalize(vec3(uv, -1.6));

  float t = 0.0, glow = 0.0;
  bool hit = false;
  for (int i = 0; i < 90; i++) {
    float d = map(ro + rd * t);
    glow += exp(-d * 10.0) * 0.015;
    if (d < 0.001) { hit = true; break; }
    t += d;
    if (t > 9.0) break;
  }

  vec3 col = sky(rd);
  if (hit) {
    vec3 p = ro + rd * t;
    vec3 n = nor(p);
    vec3 r = reflect(rd, n);
    vec3 l = normalize(vec3(0.6, 0.8, 0.5));
    float fre = pow(1.0 - max(dot(-rd, n), 0.0), 3.0);
    float dif = max(dot(n, l), 0.0);
    float spec = pow(max(dot(r, l), 0.0), 48.0);
    float ao = clamp(map(p + n * 0.15) / 0.11, 0.0, 1.0);
    vec3 base = pal(dot(n, vec3(0.3, 0.5, 0.2)) * 0.8 + length(p) * 0.3 + uTime * 0.05);
    col = base * (0.12 + 0.7 * dif) * ao
        + sky(r) * 0.6 * fre
        + base * fre * 0.9
        + vec3(spec) * 1.3;
  }
  col += pal(uTime * 0.05 + 0.6) * glow * 0.55;

  // ACES 色调映射 + Gamma + 暗角 + 胶片颗粒
  col = col * (2.51 * col + 0.03) / (col * (2.43 * col + 0.59) + 0.14);
  col = pow(clamp(col, 0.0, 1.0), vec3(0.4545));
  col *= 1.0 - 0.35 * dot(uv, uv);
  col += (fract(sin(dot(gl_FragCoord.xy + uTime, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * 0.03;
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
const cv = document.getElementById("c");
const gl = cv.getContext("webgl", { antialias: false, powerPreference: "high-performance" });
if (!gl) { document.getElementById("err").style.display = "flex"; throw new Error("no webgl"); }

function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, document.getElementById("vs").textContent));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, document.getElementById("fs").textContent));
gl.linkProgram(prog);
gl.useProgram(prog);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog, "a");
gl.enableVertexAttribArray(aLoc);
gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

const U = {
  res: gl.getUniformLocation(prog, "uRes"),
  time: gl.getUniformLocation(prog, "uTime"),
  rot: gl.getUniformLocation(prog, "uRot"),
  morph: gl.getUniformLocation(prog, "uMorph"),
};

// 自适应分辨率
const maxScale = Math.min(window.devicePixelRatio || 1, 1.5);
let scale = maxScale;
function resize() {
  cv.width = Math.floor(innerWidth * scale);
  cv.height = Math.floor(innerHeight * scale);
  gl.viewport(0, 0, cv.width, cv.height);
}
addEventListener("resize", resize);
resize();

// 形态切换
const forms = ["液态金属 · METABALLS", "极小曲面 · GYROID", "双螺旋环 · TWISTED TORUS"];
const formEl = document.getElementById("form");
let target = 0, morph = 0, lastSwitch = performance.now();
function nextForm() {
  target++;
  lastSwitch = performance.now();
  if (!formEl) return;
  formEl.classList.add("hide");
  setTimeout(() => {
    formEl.textContent = forms[target % forms.length];
    formEl.classList.remove("hide");
  }, 500);
}

// 卡片滑动：高亮居中卡片 + 指示点
const deck = document.getElementById("deck");
const cards = [...deck.querySelectorAll(".card")];
const dotsEl = document.getElementById("dots");
cards.forEach(c => {
  const d = document.createElement("i");
  d.onclick = () => c.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
  dotsEl.appendChild(d);
});
function updateDeck() {
  const mid = deck.scrollLeft + deck.clientWidth / 2;
  let best = 0, bestD = Infinity;
  cards.forEach((c, i) => {
    const d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid);
    if (d < bestD) { bestD = d; best = i; }
  });
  cards.forEach((c, i) => c.classList.toggle("on", i === best));
  [...dotsEl.children].forEach((d, i) => d.classList.toggle("on", i === best));
}
deck.addEventListener("scroll", () => requestAnimationFrame(updateDeck), { passive: true });
deck.addEventListener("wheel", e => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { deck.scrollLeft += e.deltaY; e.preventDefault(); }
}, { passive: false });
addEventListener("resize", updateDeck);
updateDeck();

// 拖动旋转（带惯性）+ 轻点切换
let rotX = 0, rotY = 0, velX = 0, velY = 0;
let dragging = false, lastX = 0, lastY = 0, moved = 0;
cv.addEventListener("pointerdown", e => {
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  velX = dx * 0.006; velY = dy * 0.006;
  lastX = e.clientX; lastY = e.clientY;
});
cv.addEventListener("pointerup", () => {
  dragging = false;
  if (moved < 6) nextForm();
});

// 主循环
const fpsEl = document.getElementById("fps");
let prev = performance.now(), acc = 0, frames = 0;
function frame(now) {
  const dt = now - prev; prev = now;
  acc += dt; frames++;
  if (frames === 40) {
    const avg = acc / frames;
    fpsEl.textContent = Math.round(1000 / avg) + " FPS · " + Math.round(scale * 100) + "%";
    if (avg > 26 && scale > 0.45) { scale *= 0.85; resize(); }
    else if (avg < 15 && scale < maxScale) { scale = Math.min(maxScale, scale * 1.1); resize(); }
    acc = 0; frames = 0;
  }

  if (now - lastSwitch > 8000) nextForm();

  rotX += velX; rotY += velY;
  rotY = Math.max(-1.2, Math.min(1.2, rotY));
  velX *= 0.93; velY *= 0.93;
  morph += (target - morph) * 0.035;

  gl.uniform2f(U.res, cv.width, cv.height);
  gl.uniform1f(U.time, now / 1000);
  gl.uniform2f(U.rot, rotX, rotY);
  gl.uniform1f(U.morph, ((morph % 3) + 3) % 3);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
