<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>HARLEY · 粒子星系</title>
<style>
  html, body { margin: 0; height: 100%; background: #020205; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .ui { position: fixed; pointer-events: none; color: rgba(255,255,255,.85);
        font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  #brand { top: 28px; left: 32px; }
  #brand h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .6em; }
  #brand p { margin: 6px 0 0; font-size: 11px; letter-spacing: .25em; opacity: .5; }
  #fps { top: 28px; right: 32px; font: 11px/1 ui-monospace, Menlo, monospace; opacity: .45; letter-spacing: .1em; }
  #form { left: 0; right: 0; bottom: 64px; text-align: center; font-size: 13px; letter-spacing: .5em; }
  #hint { left: 0; right: 0; bottom: 32px; text-align: center; font-size: 11px; letter-spacing: .3em; opacity: .35; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
         color: #fff; font-family: sans-serif; }
  #home, #theme { pointer-events: auto; padding: 7px 16px; border-radius: 999px;
          border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.06);
          -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
          color: rgba(255,255,255,.85); text-decoration: none; font-size: 11px; letter-spacing: .3em;
          transition: background .3s, border-color .3s; }
  #home { top: 76px; left: 32px; }
  #theme { top: 52px; right: 32px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #home:hover, #home:active, #theme:hover, #theme:active { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.7); }
  /* 声控按钮：和 fluid.html 同款，放在形态名上方 */
  #mic { pointer-events: auto; left: 50%; bottom: 96px; transform: translateX(-50%); padding: 13px 26px;
         border: 1px solid transparent; border-radius: 999px; cursor: pointer; white-space: nowrap;
         color: #05050a; font-size: 14px; font-weight: 600; letter-spacing: .2em;
         background: linear-gradient(90deg, #7cf7ff, #b18cff, #ff8ad8, #7cf7ff); background-size: 300% 100%;
         box-shadow: 0 0 24px rgba(160,140,255,.55); animation: flow 4s linear infinite;
         -webkit-tap-highlight-color: transparent; transition: color .3s, opacity .3s; }
  #mic:active { transform: translateX(-50%) scale(.96); }
  /* 开启后：按钮本身就是音量条，--v 是 0~1 的当前音量 */
  #mic.on { min-width: 220px; color: #fff; animation: none; border-color: rgba(124,247,255,.8);
            text-shadow: 0 1px 4px rgba(0,0,0,.6); background-size: 100% 100%;
            background: linear-gradient(90deg, rgba(124,247,255,.55) calc(var(--v, 0) * 100%), rgba(124,247,255,.1) 0);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); transition: border-color .15s; }
  #mic.on.loud { border-color: #ff8ad8; }
  #mic.busy { opacity: .7; }
  #micTip { left: 50%; bottom: 152px; transform: translateX(-50%); display: none; width: max-content; max-width: 86vw;
            padding: 7px 12px; border-radius: 10px; font-size: 11px; line-height: 1.6; text-align: center;
            background: rgba(255,170,60,.14); border: 1px solid rgba(255,170,60,.5); color: #ffd9a8; }
  @keyframes flow { to { background-position: 300% 0; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="brand"><h1>HARLEY</h1><p>GPU PARTICLE GALAXY</p></div>
<a class="ui" id="home" href="index.html">← 返回首页</a>
<div class="ui" id="fps">-- FPS</div>
<button class="ui" id="theme" type="button">配色 · 星河</button>
<div class="ui" id="form">粒子星系 · GALAXY</div>
<button class="ui" id="mic" type="button">🎤 开启声控</button>
<div class="ui" id="micTip"></div>
<div class="ui" id="hint">拖动拨动星河 · 轻点释放冲击波 · 开声控放首歌试试</div>
<div id="err">你的浏览器不支持 WebGL</div>

<script id="vs" type="x-shader/x-vertex">
attribute vec4 aP;              // 星系粒子：半径, 角度, 高度, 随机数；背景星：经度, 纬度, 距离, 2+随机数
uniform float uTime, uAspect, uSize;
uniform vec2 uRot;              // 偏航, 俯仰
uniform vec3 uTouch;            // 手指 NDC 坐标 + 力度
uniform vec3 uBurst;            // 冲击波 NDC 坐标 + 经过秒数
uniform vec3 uCore, uArmA, uArmB;
uniform float uSpin, uLoud;     // 声控：累计自转相位（安静时 = uTime）、音量力度 0~1
varying vec3 vCol;
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
void main() {
  float rnd = fract(aP.w);
  vec3 p, col;
  float br;
  if (aP.w > 1.5) {
    float s = sin(aP.y);
    p = vec3(s * cos(aP.x), cos(aP.y), s * sin(aP.x)) * aP.z;
    col = mix(vec3(0.75, 0.82, 1.0), uArmB, rnd * 0.4);
    br = 0.35 + 0.3 * sin(uTime * 2.5 + rnd * 80.0);
  } else {
    float r = aP.x;
    // 较差自转：内圈快、外圈慢
    float a = aP.y - uSpin * (0.05 + 0.14 / (0.6 + r));
    // 声控：整体微微膨胀，核心更亮（uLoud = 0 时和原来完全一样）
    p = vec3(cos(a) * r, aP.z, sin(a) * r) * (1.0 + uLoud * 0.08);
    col = mix(uCore, mix(uArmA, uArmB, rnd), smoothstep(0.05, 1.7, r));
    br = mix(1.0, 0.6, smoothstep(0.0, 3.2, r)) * (1.0 + uLoud * (0.25 + 1.6 * exp(-r * r * 2.5)));
  }
  p.xz *= rot(uRot.x);
  p.yz *= rot(uRot.y);
  float w = 6.5 - p.z;
  vec2 ndc = vec2(p.x * 2.3 / uAspect, p.y * 2.3) / w;

  // 手指拨动：推开 + 旋涡
  vec2 asp = vec2(uAspect, 1.0);
  vec2 d = (ndc - uTouch.xy) * asp;
  float L = length(d) + 1e-4;
  float f = uTouch.z * exp(-L * L * 7.0);
  ndc += (d / L * 0.18 + vec2(-d.y, d.x) / L * 0.3) * f / asp;
  float glow = f;

  // 冲击波：向外扩散的环
  vec2 b = (ndc - uBurst.xy) * asp;
  float bl = length(b) + 1e-4;
  float ring = uBurst.z * 1.4;
  float g = exp(-pow((bl - ring) * 7.0, 2.0)) * exp(-uBurst.z * 1.6);
  ndc += b / bl * g * 0.1 / asp;
  glow += g * 1.6;

  gl_Position = vec4(ndc * w, 0.0, w);
  gl_PointSize = clamp(uSize * (0.5 + rnd) / w * (1.0 + glow * 0.8), 1.0, 28.0);
  vCol = col * br * (0.3 + glow * 0.9);
}
</script>

<script id="fs" type="x-shader/x-fragment">
precision mediump float;
varying vec3 vCol;
void main() {
  vec2 q = gl_PointCoord - 0.5;
  float d = dot(q, q) * 4.0;
  if (d > 1.0) discard;
  float a = 1.0 - d;
  gl_FragColor = vec4(vCol * a * a, 1.0);
}
</script>

<script>
const cv = document.getElementById("c");
const gl = cv.getContext("webgl", { antialias: false, alpha: false, powerPreference: "high-performance" });
if (!gl) { document.getElementById("err").style.display = "flex"; throw new Error("no webgl"); }

function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, document.getElementById("vs").textContent));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, document.getElementById("fs").textContent));
gl.linkProgram(prog);
gl.useProgram(prog);

// 生成粒子（只生成一次，之后全部交给 GPU）
const N = innerWidth < 820 ? 160000 : 320000;
const ARMS = 3, TAU = Math.PI * 2;
function gauss() { return Math.sqrt(-2 * Math.log(Math.random() + 1e-9)) * Math.cos(TAU * Math.random()); }
const data = new Float32Array(N * 4);
for (let i = 0; i < N; i++) {
  const w = Math.random() * 0.999;
  if (i % 12 === 0) {
    data.set([Math.random() * TAU, Math.acos(Math.random() * 2 - 1), 9 + Math.random() * 6, 2 + w], i * 4);
  } else {
    const r = Math.max(0.02, Math.pow(Math.random(), 1.6) * 3.2 + gauss() * 0.06);
    const arm = Math.floor(Math.random() * ARMS) / ARMS * TAU;
    const ang = arm + r * 1.9 + gauss() * 0.4 / (0.5 + r * 0.6);
    const h = gauss() * (0.05 + 0.35 * Math.exp(-r * r * 3));
    data.set([r, ang, h, w], i * 4);
  }
}
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog, "aP");
gl.enableVertexAttribArray(aLoc);
gl.vertexAttribPointer(aLoc, 4, gl.FLOAT, false, 0, 0);

const U = {};
for (const k of ["uTime", "uAspect", "uSize", "uRot", "uTouch", "uBurst", "uCore", "uArmA", "uArmB", "uSpin", "uLoud"])
  U[k] = gl.getUniformLocation(prog, k);

gl.disable(gl.DEPTH_TEST);
gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE, gl.ONE);
gl.clearColor(0.008, 0.008, 0.02, 1);

// 配色主题（平滑过渡）
const themes = [
  { name: "星河", core: [1.0, 0.85, 0.6],  a: [0.35, 0.55, 1.0], b: [0.9, 0.4, 0.9] },
  { name: "极光", core: [0.8, 1.0, 0.9],   a: [0.2, 0.9, 0.7],   b: [0.3, 0.5, 1.0] },
  { name: "熔金", core: [1.0, 0.95, 0.8],  a: [1.0, 0.55, 0.2],  b: [0.9, 0.25, 0.3] },
];
let themeIdx = 0;
const pal = { core: themes[0].core.slice(), a: themes[0].a.slice(), b: themes[0].b.slice() };
const themeEl = document.getElementById("theme");
themeEl.addEventListener("click", () => {
  themeIdx = (themeIdx + 1) % themes.length;
  themeEl.textContent = "配色 · " + themes[themeIdx].name;
});

// 分辨率
const scale = Math.min(window.devicePixelRatio || 1, 1.5);
function resize() {
  cv.width = Math.floor(innerWidth * scale);
  cv.height = Math.floor(innerHeight * scale);
  gl.viewport(0, 0, cv.width, cv.height);
}
addEventListener("resize", resize);
resize();

// 交互：拖动 = 拨动 + 旋转（带惯性），轻点 = 冲击波
let rotX = 0, tilt = 1.05, velX = 0, velY = 0;
let dragging = false, lastX = 0, lastY = 0, moved = 0, touchT = 0, burstAt = -1e9;
const touch = [0, 0, 0], burst = [0, 0, 99];
const toNdc = e => [e.clientX / innerWidth * 2 - 1, 1 - e.clientY / innerHeight * 2];
cv.addEventListener("pointerdown", e => {
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  [touch[0], touch[1]] = toNdc(e);
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  if (moved > 6) touchT = 1;
  velX = dx * 0.004; velY = dy * 0.003;
  lastX = e.clientX; lastY = e.clientY;
  [touch[0], touch[1]] = toNdc(e);
});
function release(e) {
  if (!dragging) return;
  dragging = false; touchT = 0;
  if (moved < 6) { [burst[0], burst[1]] = toNdc(e); burstAt = performance.now(); }
}
cv.addEventListener("pointerup", release);
cv.addEventListener("pointercancel", release);

// 声控：和 fluid.html 同款（只在本机分析，不录音不上传；需要 HTTPS 和用户授权）
const micEl = document.getElementById("mic");
const micTip = document.getElementById("micTip");
// env：力度包络 0~1；cent：频谱重心 0（低音）~1（高音）；gate：是否超过噪声底门限；lvl：音量条；hit：本帧是否重拍 / 音量突跳
const mic = { on: false, vol: 0, bass: 0, floor: 1, bassAvg: 0, volAvg: 0, env: 0, cent: 0.5, gate: false, lvl: 0, hit: false };
const inWeChat = /MicroMessenger/i.test(navigator.userAgent);
function showTip(msg) { micTip.textContent = msg; micTip.style.display = msg ? "block" : "none"; }
function closeCtx(c) { try { Promise.resolve(c.close()).catch(() => {}); } catch (_) {} }
// 出错只影响声控：按钮上方一行提示，手指操作照常
function micFail(e) {
  const name = e && e.name;
  let msg, btn = "🎤 点此重试";
  if (!e) {
    btn = "🎤 声控不可用";
    msg = !window.isSecureContext ? "声控需要 HTTPS 页面，请用 https:// 地址打开"
      : inWeChat ? "微信里不支持麦克风，请点右上角「…」用浏览器打开" : "当前浏览器不支持麦克风，请换 Safari / Chrome 打开";
  } else if (name === "NotAllowedError" || name === "SecurityError") {
    msg = "麦克风未授权，可在浏览器设置里打开；微信里请用浏览器打开";
  } else if (name === "NotFoundError" || name === "OverconstrainedError") {
    msg = "没有检测到麦克风";
  } else if (name === "NotReadableError" || name === "AbortError") {
    msg = "麦克风被其他应用占用，关掉后再试";
  } else {
    msg = "声控不可用（" + (name || "未知错误") + "），手指操作不受影响";
  }
  micEl.textContent = btn;
  showTip(msg);
}
function stopMic() {
  mic.stream.getTracks().forEach(t => t.stop());
  closeCtx(mic.ctx);
  Object.assign(mic, { on: false, vol: 0, bass: 0, env: 0, gate: false, lvl: 0, hit: false });
  micEl.classList.remove("on", "loud"); micEl.textContent = "🎤 开启声控";
  micEl.style.boxShadow = ""; micEl.style.removeProperty("--v");
}
async function toggleMic() {
  if (mic.busy) return;
  if (mic.on) { stopMic(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !AC) { micFail(null); return; }
  let ctx = null, stream = null;
  mic.busy = true;
  micEl.classList.add("busy"); micEl.textContent = "🎤 授权中…"; showTip("");
  try {
    // iPhone Safari：AudioContext 必须在点击的同步阶段新建并 resume，麦克风也在这里同步申请，任何 await 都放在后面
    ctx = new AC();
    const resumed = ctx.resume();
    // 三项处理全关：拿原始声音，鼓点 / 拍手的起伏不会被自动增益压平
    const asked = navigator.mediaDevices.getUserMedia(
      { audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    stream = await asked;
    await resumed;
    if (ctx.state !== "running") await ctx.resume();
    // 只接到 AnalyserNode 读频谱：不接扬声器（不会啸叫），不用 MediaRecorder，不发网络请求 → 不录音、不上传
    const an = ctx.createAnalyser();
    an.fftSize = 512; an.smoothingTimeConstant = 0.6;
    ctx.createMediaStreamSource(stream).connect(an);
    // 麦克风被系统断开（来电、权限被收回）时自动关掉
    stream.getTracks().forEach(t => { t.onended = () => { if (mic.on) { stopMic(); showTip("麦克风已断开，点按钮可重新开启"); } }; });
    Object.assign(mic, { on: true, stream, ctx, an, buf: new Uint8Array(an.frequencyBinCount),
      floor: 1, bassAvg: 0, volAvg: 0, env: 0, cent: 0.5, gate: false, lvl: 0, hit: false });
    micEl.classList.add("on"); micEl.textContent = "🎤 声控中 · 点击关闭";
  } catch (e) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (ctx) closeCtx(ctx);
    micFail(e);
  }
  mic.busy = false;
  micEl.classList.remove("busy");
}
micEl.addEventListener("click", toggleMic);
function readMic() {
  if (!mic.on) return false;
  mic.an.getByteFrequencyData(mic.buf);
  const b = mic.buf, n = b.length;            // 每格约 90Hz
  let lo = 0, all = 0, wsum = 0;
  for (let i = 1; i < n; i++) {
    const v = b[i] / 255;
    all += v; wsum += v * i;
    if (i < 6) lo += v;
  }
  mic.vol = all / (n - 1); mic.bass = lo / 5;
  // 自适应噪声底：更安静就立刻跟下去；没出声时约 5 秒跟上环境变吵；出声时几乎冻结
  if (mic.vol < mic.floor) mic.floor = mic.vol;
  else mic.floor += (mic.vol - mic.floor) * (mic.gate ? 0.0005 : 0.004);
  // 带回差的门限：超过 底噪×1.5+0.015 才算有声，降到 底噪×1.2+0.008 以下才算安静
  if (!mic.gate && mic.vol > mic.floor * 1.5 + 0.015) mic.gate = true;
  else if (mic.gate && mic.vol < mic.floor * 1.2 + 0.008) mic.gate = false;
  // 力度包络：涨得快、落得慢
  const target = mic.gate ? Math.min(1, (mic.vol - mic.floor) * 6) : 0;
  mic.env += (target - mic.env) * (target > mic.env ? 0.5 : 0.12);
  // 频谱重心：按对数映射到 0~1，约 280Hz → 0，约 3.7kHz → 1
  if (mic.gate && all > 0) {
    const t = Math.log(wsum / all / 3) / Math.log(40 / 3);
    mic.cent += (Math.min(1, Math.max(0, t)) - mic.cent) * 0.15;
  }
  // 重拍：低音突增，或整体音量突然跳高（拍手）；用更新前的平均值比较
  mic.hit = mic.gate && ((mic.bass > 0.35 && mic.bass > mic.bassAvg * 1.5) || mic.vol > mic.volAvg * 1.6 + 0.04);
  mic.bassAvg += (mic.bass - mic.bassAvg) * 0.05;
  mic.volAvg += (mic.vol - mic.volAvg) * 0.05;
  micEl.style.boxShadow = "0 0 " + Math.round(mic.env * 40) + "px rgba(124,247,255,.8)";
  // 音量条：开方让小音量也看得见，再平滑一下避免抖动；过门限时边框变粉
  mic.lvl += (Math.min(1, Math.sqrt(mic.vol * 2.5)) - mic.lvl) * 0.35;
  micEl.style.setProperty("--v", mic.lvl.toFixed(3));
  micEl.classList.toggle("loud", mic.gate);
  return true;
}
// 色相旋转：绕灰轴 (1,1,1) 转 a 弧度；a = 0 时原样返回
function hueRot(c, a) {
  if (a === 0) return c;
  const k = 1 / Math.sqrt(3), cs = Math.cos(a), sn = Math.sin(a), m = (c[0] + c[1] + c[2]) / 3 * (1 - cs);
  return [c[0] * cs + k * (c[2] - c[1]) * sn + m,
          c[1] * cs + k * (c[0] - c[2]) * sn + m,
          c[2] * cs + k * (c[1] - c[0]) * sn + m].map(v => Math.max(0, v));
}

// 主循环：按帧率自动增减粒子数
const fpsEl = document.getElementById("fps");
let count = N, prev = performance.now(), acc = 0, frames = 0;
let spin = prev / 1000, hue = 0, lastBeat = 0;   // spin：累计自转相位，安静时每帧 +dt，和 uTime 同步
function frame(now) {
  const dt = now - prev; prev = now;
  acc += dt; frames++;
  if (frames === 40) {
    const avg = acc / frames;
    if (avg > 24 && count > 40000) count = Math.floor(count * 0.8);
    else if (avg < 15 && count < N) count = Math.min(N, Math.floor(count * 1.1));
    fpsEl.textContent = Math.round(1000 / avg) + " FPS · " + (count / 10000).toFixed(1) + " 万粒子";
    acc = 0; frames = 0;
  }

  rotX += velX;
  tilt = Math.max(0.2, Math.min(1.5, tilt + velY));
  velX *= 0.94; velY *= 0.9;
  touch[2] += (touchT - touch[2]) * 0.12;
  // 声控：音量 → 转速 / 核心亮度 / 膨胀；重拍 → 中心冲击波；频谱重心 → 色相缓慢偏移
  const heard = readMic(), loud = heard ? mic.env : 0;
  spin += dt / 1000 * (1 + loud * 2.5);
  if (heard && mic.hit && now - lastBeat > 250) { burst[0] = 0; burst[1] = 0; burstAt = now; lastBeat = now; }
  hue += ((heard && mic.gate ? (mic.cent - 0.5) * 2.2 : 0) - hue) * 0.02;
  if (Math.abs(hue) < 1e-4) hue = 0;
  burst[2] = (now - burstAt) / 1000;

  const th = themes[themeIdx];
  for (const k of ["core", "a", "b"]) for (let i = 0; i < 3; i++) pal[k][i] += (th[k][i] - pal[k][i]) * 0.05;

  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform1f(U.uTime, now / 1000);
  gl.uniform1f(U.uAspect, cv.width / cv.height);
  gl.uniform1f(U.uSize, cv.height * 0.012);
  gl.uniform2f(U.uRot, rotX, tilt);
  gl.uniform3fv(U.uTouch, touch);
  gl.uniform3fv(U.uBurst, burst);
  gl.uniform3fv(U.uCore, hueRot(pal.core, hue));
  gl.uniform3fv(U.uArmA, hueRot(pal.a, hue));
  gl.uniform3fv(U.uArmB, hueRot(pal.b, hue));
  gl.uniform1f(U.uSpin, spin);
  gl.uniform1f(U.uLoud, loud);
  gl.drawArrays(gl.POINTS, 0, count);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
